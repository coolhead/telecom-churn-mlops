apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: churn-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/your-org/flagship-a-churn-kfp.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: churn-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
