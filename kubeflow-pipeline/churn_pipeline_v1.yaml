          parameterType: NUMBER_DOUBLE
        threshold:
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        X_val_ds:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        model_in:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        y_val_ds:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        aws_access_key_id:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        aws_secret_access_key:
          defaultValue: ''
          isOptional: true
          parameterType: STRING
        mlflow_tracking_uri:
